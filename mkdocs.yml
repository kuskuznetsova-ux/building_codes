site_name: Строительные нормы RS · RU · EU · UK
site_description: Сравнение нормативов проектирования, архитектуры и пожарной безопасности Сербии, России, ЕС и Англии
docs_dir: docs
theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Светлая тема}
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Главная: index.md
  - Сравнение:
      - Стадии проектирования и строительства: sravnenie/stadii.md
      - Проектирование: sravnenie/proektirovanie.md
      - Архитектура: sravnenie/arhitektura.md
      - Пожарная безопасность: sravnenie/pozharnaya.md
  - Нормативы по странам:
      - normy/index.md
  - Глоссарий: glossary.md
  - Источники: istochniki.md
  - Как вести портал: contributing.md
