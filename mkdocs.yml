site_name: Строительные нормы RS · RU · EU · UK
site_description: Сравнение нормативов проектирования, архитектуры и пожарной безопасности Сербии, России, ЕС и Англии
docs_dir: docs
theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Светлая тема}
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/name:site_slugs.tab_slugify
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Главная: index.md
  - Сравнение:
      - Стадии проектирования и строительства:
          - Матрица стадий: sravnenie/stadii.md
          - 1. Стратегия и обоснование: stadii/01-strategiya.md
          - 2. Подготовка задания: stadii/02-zadanie.md
          - 3. Концепция: stadii/03-koncepciya.md
          - 4. Эскиз / предварительный проект: stadii/04-eskiz.md
          - 5. Согласование архитектурного облика: stadii/05-ago-agr.md
          - 6. Проект для разрешения: stadii/06-proekt-razresheniya.md
          - 7. Проверка / экспертиза: stadii/07-ekspertiza.md
          - 8. Разрешение на строительство: stadii/08-razreshenie.md
          - 9. Рабочая документация: stadii/09-rabochaya.md
          - 10. Строительство: stadii/10-stroitelstvo.md
          - 11. Исполнительная документация: stadii/11-ispolnitelnaya.md
          - 12. Приёмка и ввод: stadii/12-priemka-vvod.md
          - 13. Передача заказчику: stadii/13-peredacha.md
          - 14. Эксплуатация: stadii/14-ekspluatatsiya.md
      - Проектирование: sravnenie/proektirovanie.md
      - Архитектура: sravnenie/arhitektura.md
  - Пожарная безопасность:
      - Обзор и аналоги СП: pozharnaya/index.md
      - Эвакуация (СП 1): pozharnaya/sp1-evakuaciya.md
      - Распространение пожара (СП 4): pozharnaya/sp4-ogranichenie-rasprostraneniya.md
  - Нормативы по странам:
      - normy/index.md
  - Глоссарий: glossary.md
  - Источники: istochniki.md
  - Как вести портал: contributing.md

validation:
  anchors: ignore
