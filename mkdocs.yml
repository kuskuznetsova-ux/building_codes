site_name: Строительные нормы RS · RU · EU · UK
site_description: Сравнение нормативов проектирования, архитектуры и пожарной безопасности Сербии, России, ЕС и Англии
docs_dir: docs
theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Светлая тема}
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/name:site_slugs.tab_slugify
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
nav:
  - Главная: index.md
  - Сравнение:
      - Стадии проектирования и строительства:
          - Матрица стадий: sravnenie/stadii.md
          - 1. Стратегия и обоснование: stadii/01-strategiya.md
          - 2. Подготовка задания: stadii/02-zadanie.md
          - 3. Концепция: stadii/03-koncepciya.md
          - 4. Эскиз / предварительный проект: stadii/04-eskiz.md
          - 5. Согласование архитектурного облика: stadii/05-ago-agr.md
          - 6. Проект для разрешения: stadii/06-proekt-razresheniya.md
          - 7. Проверка / экспертиза: stadii/07-ekspertiza.md
          - 8. Разрешение на строительство: stadii/08-razreshenie.md
          - 9. Рабочая документация: stadii/09-rabochaya.md
          - 10. Строительство: stadii/10-stroitelstvo.md
          - 11. Исполнительная документация: stadii/11-ispolnitelnaya.md
          - 12. Приёмка и ввод: stadii/12-priemka-vvod.md
          - 13. Передача заказчику: stadii/13-peredacha.md
          - 14. Эксплуатация: stadii/14-ekspluatatsiya.md
      - Проектирование: sravnenie/proektirovanie.md
      - Архитектура: sravnenie/arhitektura.md
  - Пожарная безопасность:
      - Матрица основных правил: pozharnaya/index.md
      - 1. Число эвакуационных выходов и лестниц: pozharnaya/vyhody.md
      - 2. Расстояние от двери квартиры до выхода: pozharnaya/rasstoyanie.md
      - 3. Ширина путей эвакуации, лестниц и дверей: pozharnaya/shirina.md
      - 4. Огнестойкость строительных конструкций: pozharnaya/ognestojkost.md
      - 5. Секции, отсеки и отделение квартир: pozharnaya/otseki.md
      - 6. Расстояния между зданиями и до границы участка: pozharnaya/razryvy.md
      - 7. Наружные стены и фасады: pozharnaya/fasady.md
      - Высотные здания (матрица): pozharnaya/vysotnye/index.md
      - В1. Порог «высотного здания» и способ измерения высоты: pozharnaya/vysotnye/porog.md
      - В2. Эвакуационные лестницы и выходы: pozharnaya/vysotnye/lestnitsy.md
      - В3. Длина путей эвакуации в высотных зданиях: pozharnaya/vysotnye/puti.md
      - В4. Пожарные лифты и доступ пожарных: pozharnaya/vysotnye/lifty.md
      - В5. Огнестойкость и пожарные отсеки: pozharnaya/vysotnye/ognestojkost.md
      - В6. Фасады и наружные стены: pozharnaya/vysotnye/fasady.md
      - "Прежняя таблица — эвакуация (СП 1)": pozharnaya/sp1-evakuaciya.md
      - "Прежняя таблица — распространение пожара (СП 4)": pozharnaya/sp4-ogranichenie-rasprostraneniya.md
  - Нормативы по странам:
      - normy/index.md
  - Глоссарий: glossary.md
  - Источники: istochniki.md
  - Как вести портал: contributing.md

validation:
  anchors: ignore
